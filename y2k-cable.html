<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>Y2K CABLE — 24/7 early-2000s TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--fg:#e8f7ff;--accent:#7cf7c9;--hot:#ff4fa3;--gold:#ffd166;--dim:#8a86b3;--bg:#05030f;--panel:rgba(10,14,52,.96);--cell:#18205e;--cellb:#2c3a8f;--sel:#2e7dd7}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #tv{position:fixed;inset:0;background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #static{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;pointer-events:none;image-rendering:pixelated}
  #static.on{opacity:1}
  #scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  #vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.85)}
  #osd{position:absolute;top:max(18px,env(safe-area-inset-top));right:28px;font-size:clamp(40px,8vw,84px);color:var(--accent);text-shadow:0 0 8px rgba(124,247,201,.7),3px 3px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;line-height:1;z-index:4}
  #osd.on{opacity:1}
  #msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(20px,3vw,32px);text-align:center;text-shadow:2px 2px 0 #000;pointer-events:none;max-width:80%}

  /* Channel banner */
  #banner{position:absolute;left:3%;right:3%;bottom:calc(76px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;gap:4px 18px;background:linear-gradient(180deg,rgba(24,32,104,.95),rgba(10,14,52,.95));border:2px solid var(--cellb);border-radius:8px;padding:12px 18px;opacity:0;transform:translateY(12px);transition:all .35s;pointer-events:none;font-size:clamp(17px,2.3vw,26px)}
  #banner.on{opacity:1;transform:none}
  #banner .num{grid-row:1/5;font-size:clamp(44px,6vw,70px);color:var(--gold);line-height:.9;align-self:center;text-shadow:2px 2px 0 #000}
  #banner .net{color:var(--accent);font-size:1.15em}
  #banner .clock{text-align:right;color:var(--gold)}
  #banner .title{grid-column:2/4;font-size:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #banner .times{grid-column:2/4;display:flex;gap:12px;align-items:center;color:var(--dim)}
  #banner .prog{flex:1;height:8px;background:#0b0f33;border:1px solid var(--cellb);border-radius:4px;overflow:hidden}
  #banner .prog i{display:block;height:100%;background:var(--accent)}
  #banner .next{grid-column:2/4;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #banner .next b{color:var(--hot);font-weight:normal}

  /* Remote */
  #bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);transition:opacity .4s;z-index:4}
  #bar.hide{opacity:0;pointer-events:none}
  button{font-family:inherit;font-size:22px;background:rgba(30,18,80,.88);color:var(--fg);border:1px solid #3d3380;border-radius:6px;padding:6px 14px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}

  /* Guide */
  #guide{position:absolute;inset:0;display:none;grid-template-rows:minmax(150px,36%) 1fr;z-index:3}
  #guide.on{display:grid}
  #gtop{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;gap:16px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
  #ginfo{background:var(--panel);border:2px solid var(--cellb);border-radius:8px;padding:10px 16px;max-width:min(560px,62%);font-size:clamp(17px,2vw,24px)}
  #ginfo .t{color:var(--accent);font-size:1.3em;line-height:1}
  #ginfo .s{color:var(--dim)}
  #ginfo a{color:var(--gold)}
  #gclock{background:var(--panel);border:2px solid var(--cellb);border-radius:8px;padding:6px 14px;font-size:clamp(22px,3vw,36px);color:var(--gold);text-align:right;line-height:1}
  #gclock small{display:block;font-size:.55em;color:var(--dim)}
  #gbody{background:var(--panel);border-top:3px solid var(--gold);overflow:auto;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .grow{display:flex;height:52px;border-bottom:1px solid #0a0d30}
  .grow.head{height:34px;position:sticky;top:0;background:#0d1240;z-index:2;color:var(--gold);font-size:22px}
  .gch{flex:0 0 clamp(110px,18vw,190px);display:flex;align-items:center;gap:8px;padding:0 10px;background:#121a55;border-right:2px solid var(--cellb);cursor:pointer;overflow:hidden;white-space:nowrap}
  .gch b{color:var(--gold);font-weight:normal;font-size:24px}
  .grow.sel .gch{background:var(--sel)}
  .gtrack{position:relative;flex:1;overflow:hidden}
  .gtick{position:absolute;top:0;bottom:0;padding:5px 8px;border-left:1px solid var(--cellb)}
  .gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--hot);z-index:1;pointer-events:none}
  .gp{position:absolute;top:3px;bottom:3px;background:var(--cell);border:1px solid var(--cellb);border-radius:4px;padding:2px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:20px;line-height:1.05}
  .gp small{display:block;color:var(--dim);font-size:16px;overflow:hidden;text-overflow:ellipsis}
  .gp.live{background:#22307a}
  .grow.sel .gp.focus{background:var(--sel);border-color:#fff}
  .gp:hover{border-color:var(--accent)}
  .gload{padding:14px 10px;color:var(--dim);font-size:18px}
  #gadd{display:grid;gap:8px;grid-template-columns:1fr 2fr auto;align-items:center;padding:12px 10px}
  #gadd input{font-family:inherit;font-size:20px;background:#0b0726;color:var(--fg);border:1px solid #3d3380;border-radius:6px;padding:6px 10px;min-width:0}
  .hint{color:var(--dim);font-size:17px;padding:0 10px 10px}
  .x{font-size:15px;padding:0 6px;margin-left:auto}

  #power{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#1c0a57 0,#05030f 70%);z-index:10;text-align:center;padding:20px}
  #power h1{margin:0;font-weight:normal;font-size:clamp(56px,11vw,120px);color:var(--accent);text-shadow:0 0 18px rgba(124,247,201,.6),4px 4px 0 var(--hot);letter-spacing:4px}
  #power p{margin:0;color:var(--dim);font-size:24px}
  #power button{font-size:34px;padding:10px 34px;border-color:var(--hot)}
</style>
</head>
<body>
<div id="tv">
  <video id="v" playsinline preload="auto"></video>
  <canvas id="static" width="160" height="90"></canvas>
  <div id="scan"></div><div id="vignette"></div>
  <div id="osd"></div>
  <div id="msg"></div>
  <div id="banner"></div>
  <div id="guide">
    <div id="gtop"><div id="ginfo"></div><div id="gclock"></div></div>
    <div id="gbody"></div>
  </div>
  <div id="bar">
    <button tabindex="-1" id="bDown" title="Channel down (↓)">CH ▼</button>
    <button tabindex="-1" id="bUp" title="Channel up (↑)">CH ▲</button>
    <button tabindex="-1" id="bLast" title="Previous channel (L / Backspace)">LAST</button>
    <button tabindex="-1" id="bGuide" title="Guide (G)">GUIDE</button>
    <button tabindex="-1" id="bInfo" title="Info (I)">INFO</button>
    <button tabindex="-1" id="bMute" title="Mute (M)">MUTE</button>
    <button tabindex="-1" id="bFull" title="Fullscreen (F)">⛶</button>
  </div>
  <div id="power">
    <h1>Y2K CABLE</h1>
    <p>Basic cable, circa 2002 · every channel streams live from the Internet Archive</p>
    <button id="bPower">⏻ POWER</button>
    <p style="font-size:18px">↑/↓ or CH+/− channel · ←/→ guide · OK info · type a number to tune · L last channel · G guide (←/→ time, Enter tune) · I info · M mute · F fullscreen</p>
  </div>
</div>

<script>
/* =====================================================================
   CHANNEL LINEUP — edit freely. Each channel is an archive.org search.
   num:     channel number on the box
   terms:   matched against item titles and subjects (OR'd together)
   extra:   optional extra archive.org query clause (AND'd)
   exclude: optional title words to skip
   block:   how many consecutive episodes to air from one show before switching (default 2)
   minLen:  skip videos shorter than this many seconds (default 300)
   ===================================================================== */
const NINETIES = "1980 OR 1981 OR 1982 OR 1983 OR 1984 OR 1985 OR 1986 OR 1987 OR 1988 OR 1989 OR 1990 OR 1991 OR 1992 OR 1993 OR 1994 OR 1995 OR 1996 OR 1997 OR 1998";
const Y2K = "title:(2000 OR 2001 OR 2002 OR 2003 OR 2004 OR 2005)";
const CHANNELS = [
  { num: 5, name: "SAT MORNING", desc: "Fox Kids, Kids' WB, Cartoon Cartoons, One Saturday Morning",
    terms: ["fox kids","kids wb","one saturday morning","cartoon cartoon","dexter's laboratory","powerpuff girls","ed edd n eddy","courage the cowardly dog","johnny bravo","samurai jack","digimon","jackie chan adventures","x-men evolution","static shock","batman beyond"],
    exclude: ["teletubbies","barney","sesame","blues clues","wiggles"] },
  { num: 28, name: "NICK & SNICK", desc: "SNICK, Nicktoons, All That, Invader Zim, Rocket Power",
    terms: ["snick","nicktoons","all that","kenan & kel","invader zim","rocket power","hey arnold","the fairly oddparents","rugrats","the wild thornberrys","angry beavers","cat dog","as told by ginger","zoog disney"] },
  { num: 32, name: "TOONAMI", desc: "DBZ, Gundam Wing, Outlaw Star, Tenchi, Yu Yu Hakusho",
    terms: ["toonami","dragon ball z","gundam wing","outlaw star","tenchi muyo","yu yu hakusho","rurouni kenshin","zoids","reboot","sailor moon","cardcaptors","blue gender","big o"] },
  { num: 33, name: "ADULT SWIM", desc: "Late night: ATHF, Space Ghost, Sealab 2021, Bebop, FLCL",
    terms: ["adult swim","aqua teen hunger force","space ghost coast to coast","sealab 2021","harvey birdman","home movies","cowboy bebop","flcl","inuyasha","the brak show","tom goes to the mayor"] },
  { num: 44, name: "SCI-FI", desc: "X-Files, Stargate SG-1, Buffy, Angel, Farscape, Firefly",
    terms: ["x-files","stargate sg-1","stargate sg1","buffy the vampire slayer","angel","farscape","firefly","andromeda","lexx","the lone gunmen","dark angel","roswell","sliders"],
    exclude: ["universe","1994","kitten","teen angel","touched by an angel","charlie"] },
  { num: 51, name: "MTV2K", desc: "TRL, Jackass, Celebrity Deathmatch, Daria, Cribs, Punk'd",
    terms: ["total request live","trl","jackass","celebrity deathmatch","daria","mtv cribs","punk'd","pimp my ride","the osbournes","undressed","beavis and butt-head","clone high","viva la bam"] },
  { num: 64, name: "TECHTV / G4", desc: "The Screen Savers, X-Play, Call for Help, Extended Play",
    terms: ["techtv","tech tv","screen savers","x-play","xplay","call for help","extended play","judgment day","g4tv","attack of the show","icons g4","cinematech"] },
  { num: 71, name: "JAPAN TV", desc: "Takeshi's Castle, MXC, Iron Chef, Sasuke, Game Center CX",
    terms: ["takeshi's castle","mxc","most extreme elimination challenge","iron chef","sasuke","ninja warrior","gamecenter cx","game center cx","silent library","gaki no tsukai","banzai"],
    exclude: ["naruto","unus","kungpow","annus","wrestling","junior"] },
  { num: 88, name: "VHS ATTIC", desc: "Raw off-air tape recordings, 2000–2005", block: 1, minLen: 120,
    terms: ["vhs","off air","off-air","tv recording","taped","recorded"],
    extra: `${Y2K} AND NOT title:(${NINETIES} OR aerobic OR workout OR wedding OR church)` },
  { num: 99, name: "AD BREAK", desc: "Commercials & bumpers from 2000–2005", block: 1, minLen: 20,
    terms: ["commercials","commercial","commercial break","bumpers","promos"],
    extra: `${Y2K} AND NOT title:(${NINETIES})` },
];

// Words that usually mean a foreign dub, a review, or other noise
const GLOBAL_EXCLUDE = ["latino","español","espanol","castellano","vostfr","dublado","legendado","temporada","doblaje","trailer","reaction","review","podcast","amv","ytp","poop","fandub","abridged","lyrics"];
const SLOT_MS = 6 * 3600 * 1000;   // the schedule is rebuilt every 6 hours (UTC-aligned)
const SEARCH_ROWS = 200;

// ---core---
function hashStr(s){let h1=0xdeadbeef^s.length,h2=0x41c6ce57^s.length;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);return h1>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const natCmp=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'}).compare;
function parseLen(v){if(v==null)return 0;const s=String(v);if(s.includes(':'))return s.split(':').map(Number).reduce((a,b)=>a*60+b,0);const n=parseFloat(s);return isFinite(n)?n:0;}
function quoteTerm(t){return /^[a-z0-9]+$/i.test(t)?t:'"'+t.replace(/"/g,'')+'"';}
function buildQuery(ch){
  const t=ch.terms.map(quoteTerm).join(' OR ');
  let q=`mediatype:movies AND (title:(${t}) OR subject:(${t}))`;
  if(ch.extra) q+=` AND (${ch.extra})`;
  const ex=[...GLOBAL_EXCLUDE,...(ch.exclude||[])].map(quoteTerm).join(' OR ');
  if(ex) q+=` AND NOT title:(${ex})`;
  return q;
}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function jsonp(url){return new Promise((res,rej)=>{
  const cb='_y2k'+Math.random().toString(36).slice(2);const s=document.createElement('script');
  const done=()=>{clearTimeout(to);try{delete window[cb];}catch(e){}s.remove();};
  const to=setTimeout(()=>{done();rej(new Error('timeout'));},20000);
  window[cb]=d=>{done();res(d);};s.onerror=()=>{done();rej(new Error('network'));};
  s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s);});}
async function getJSON(url){
  try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  catch(e){return jsonp(url);}
}
const memIds=new Map();
function getIds(ch){
  const q=buildQuery(ch);const key='y2k:ids:'+hashStr(q);
  if(memIds.has(key))return memIds.get(key);
  const p=(async()=>{
    const day=new Date().toISOString().slice(0,10);
    const c=lsGet(key);if(c&&c.day===day&&c.ids.length)return c.ids;
    const ps=new URLSearchParams({q,rows:SEARCH_ROWS,output:'json'});ps.append('fl[]','identifier');ps.append('sort[]','downloads desc');
    const d=await getJSON('https://archive.org/advancedsearch.php?'+ps.toString());
    const ids=[...new Set((d.response&&d.response.docs||[]).map(x=>x.identifier))].sort();
    if(!ids.length)throw new Error('No signal: nothing on archive.org matches this channel');
    lsSet(key,{day,ids});return ids;
  })();
  memIds.set(key,p);p.catch(()=>memIds.delete(key));return p;
}
// Reduce archive.org metadata to browser-playable videos, one per source file
function compactMeta(id,d){
  const files=(d&&d.files)||[];const groups=new Map();
  for(const f of files){
    const name=f.name||'';if(!/\.(mp4|m4v)$/i.test(name))continue;
    if(/(_sample|\.thumbs\/|_thumb)/i.test(name))continue;
    const key=f.source==='derivative'&&f.original?f.original:name;
    const score=(f.source==='original'?3:0)+(/h\.264/i.test(f.format||'')?2:0)+(/512Kb/i.test(f.format||'')?-1:0);
    const len=parseLen(f.length);const g=groups.get(key);
    if(!g||score>g.score||(!g.len&&len))groups.set(key,{name,len:len||(g&&g.len)||0,score});
  }
  const out=[...groups.values()].filter(g=>g.len>0).map(g=>({name:g.name,len:g.len})).sort((a,b)=>natCmp(a.name,b.name));
  const md=(d&&d.metadata)||{};
  return {id,title:Array.isArray(md.title)?md.title[0]:(md.title||id),files:out};
}
const memMeta=new Map();
function getMeta(id){
  if(memMeta.has(id))return memMeta.get(id);
  const key='y2k:meta:'+id;const c=lsGet(key);
  if(c&&Date.now()-c.t<7*864e5){const p=Promise.resolve(c.m);memMeta.set(id,p);return p;}
  const p=getJSON('https://archive.org/metadata/'+encodeURIComponent(id)).then(d=>{const m=compactMeta(id,d);lsSet(key,{t:Date.now(),m});return m;})
    .catch(()=>({id,title:id,files:[]}));
  memMeta.set(id,p);return p;
}
const badFiles=new Set();

// The programming for one 6-hour slot. Deterministic: every copy of this page airs the same thing.
async function* walk(ch,anchor){
  const ids=await getIds(ch);
  const r=rng(hashStr(ch.name+'|'+anchor));
  const order=shuffle(ids,r);
  const block=ch.block||2,minLen=ch.minLen||300,maxLen=4*3600,slotEnd=anchor+SLOT_MS;
  let cursor=anchor,produced=false;
  for(let i=0;cursor<slotEnd;i++){
    if(i>=order.length&&!produced)throw new Error('No signal: no playable videos on this channel');
    for(let k=1;k<=3;k++)getMeta(order[(i+k)%order.length]); // prefetch
    const m=await getMeta(order[i%order.length]);
    const pick=r(); // always consume, so the schedule stays deterministic
    const files=m.files.filter(f=>f.len>=minLen&&f.len<=maxLen&&!badFiles.has(m.id+'/'+f.name));
    if(!files.length)continue;
    const start=files.length<=block?0:Math.floor(pick*(files.length-block+1));
    for(const f of files.slice(start,start+block)){
      if(cursor>=slotEnd)break;
      const end=Math.min(cursor+f.len*1000,slotEnd);
      yield {start:cursor,end,id:m.id,show:m.title,file:f.name,len:f.len};
      produced=true;cursor=end;
    }
  }
}
async function scheduleAt(ch,t){
  const anchor=Math.floor(t/SLOT_MS)*SLOT_MS;let cur=null;
  for await(const e of walk(ch,anchor)){if(cur)return{cur,next:e};if(e.end>t)cur=e;}
  if(!cur)throw new Error('No signal');
  for await(const e of walk(ch,anchor+SLOT_MS))return{cur,next:e};
  return{cur,next:null};
}
async function listing(ch,from,to){
  const out=[];
  for(let a=Math.floor(from/SLOT_MS)*SLOT_MS;a<to;a+=SLOT_MS){
    for await(const e of walk(ch,a)){if(e.start>=to)break;if(e.end>from)out.push(e);}
  }
  return out;
}
function fileUrl(id,name){return 'https://archive.org/download/'+encodeURIComponent(id)+'/'+name.split('/').map(encodeURIComponent).join('/');}
function prettyName(n){return n.replace(/^.*\//,'').replace(/\.(mp4|m4v)$/i,'').replace(/\s*[\(\[][^\)\]]*(p|fps|kbit|h264|x264|aac|rip|dvd|vhs)[^\)\]]*[\)\]]/gi,'').replace(/\b(dvdrip|xvid|x264|h264|720p|480p|1080p)\b.*$/i,'').replace(/[_.]+/g,' ').replace(/\s+/g,' ').trim();}
// ---endcore---

/* ============================ CABLE BOX ============================ */
const $=id=>document.getElementById(id);
const v=$('v'),osd=$('osd'),banner=$('banner'),msg=$('msg'),guide=$('guide'),bar=$('bar');
let channels=[],chIdx=0,lastIdx=null,tuneTok=0,now=null,loadTimer=null,slotTimer=null,osdTimer=null,bannerTimer=null,sigTimer=null;

function loadChannels(){
  const custom=(lsGet('y2k:custom')||[]).map(c=>({...c,custom:true}));
  channels=[...CHANNELS,...custom].sort((a,b)=>a.num-b.num);
}
loadChannels();
{const saved=lsGet('y2k:num');const i=channels.findIndex(c=>c.num===saved);chIdx=i>=0?i:0;}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtClock=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const epTitle=e=>{const p=prettyName(e.file);return p&&p.toLowerCase()!==String(e.show).toLowerCase()?p:'';};

// TV static
const sc=$('static'),sx=sc.getContext('2d');let staticOn=false;
function drawStatic(){if(!staticOn)return;const img=sx.createImageData(sc.width,sc.height);const d=img.data;for(let i=0;i<d.length;i+=4){const g=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=g;d[i+3]=255;}sx.putImageData(img,0,0);requestAnimationFrame(drawStatic);}
function setStatic(on){if(on&&!staticOn){staticOn=true;drawStatic();}staticOn=on;sc.classList.toggle('on',on);}

function showOSD(text){osd.textContent=text;osd.classList.add('on');clearTimeout(osdTimer);osdTimer=setTimeout(()=>osd.classList.remove('on'),2500);}
function renderBanner(){
  const ch=channels[chIdx];const t=Date.now();
  let h=`<div class="num">${ch.num}</div><div class="net">${esc(ch.name)}</div><div class="clock">${fmtClock(t)}</div>`;
  if(now){const c=now.cur,n=now.next;const pct=Math.min(100,Math.max(0,(t-c.start)/(c.end-c.start)*100));const ep=epTitle(c);
    h+=`<div class="title">${esc(c.show)}${ep?' — '+esc(ep):''}</div>
        <div class="times">${fmtClock(c.start)} – ${fmtClock(c.end)}<span class="prog"><i style="width:${pct}%"></i></span></div>
        <div class="next">${n?`<b>NEXT</b> ${fmtClock(n.start)} ${esc(n.show)}${epTitle(n)?' — '+esc(epTitle(n)):''}`:''}</div>`;
  }else h+=`<div class="title" style="color:var(--dim)">Tuning…</div>`;
  banner.innerHTML=h;
}
function showBanner(ms=6000){renderBanner();banner.classList.add('on');clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>banner.classList.remove('on'),ms);}

async function tune(idx,{quiet=false,remember=true}={}){
  idx=(idx+channels.length)%channels.length;
  if(remember&&idx!==chIdx)lastIdx=chIdx;
  chIdx=idx;lsSet('y2k:num',channels[chIdx].num);
  const tok=++tuneTok;clearTimeout(loadTimer);clearTimeout(slotTimer);clearTimeout(sigTimer);
  now=null;setStatic(true);msg.textContent='';v.pause();v.removeAttribute('src');
  if(!quiet){showOSD(channels[chIdx].num);showBanner(8000);}
  sigTimer=setTimeout(()=>{if(tok===tuneTok)msg.textContent='SEARCHING FOR SIGNAL…';},5000);
  let s;
  try{s=await scheduleAt(channels[chIdx],Date.now());}
  catch(e){if(tok!==tuneTok)return;clearTimeout(sigTimer);msg.textContent='📡 '+(e.message||'No signal');return;}
  if(tok!==tuneTok)return;
  now=s;if(banner.classList.contains('on'))renderBanner();
  if(guide.classList.contains('on'))renderGuide();
  v.src=fileUrl(s.cur.id,s.cur.file);
  loadTimer=setTimeout(()=>fail(s.cur,tok),25000);
  v.onloadedmetadata=()=>{
    if(tok!==tuneTok)return;
    const off=(Date.now()-s.cur.start)/1000;
    if(isFinite(v.duration)&&off>=v.duration-2){tune(chIdx,{quiet:true,remember:false});return;}
    v.currentTime=Math.max(0,off);v.play().catch(()=>{});
  };
  v.onplaying=()=>{if(tok!==tuneTok)return;clearTimeout(loadTimer);clearTimeout(sigTimer);msg.textContent='';setStatic(false);};
  v.onended=()=>{if(tok===tuneTok)nextProgram(tok);};
  v.onerror=()=>{if(tok===tuneTok&&v.getAttribute('src'))fail(s.cur,tok);};
  slotTimer=setTimeout(()=>nextProgram(tok),Math.max(1000,s.cur.end-Date.now()));
}
function nextProgram(tok){if(tok!==tuneTok)return;tune(chIdx,{quiet:true,remember:false}).then(()=>showBanner());}
function fail(entry,tok){if(tok!==tuneTok)return;badFiles.add(entry.id+'/'+entry.file);tune(chIdx,{quiet:true,remember:false});}

/* ---- Guide: classic cable grid ---- */
const HALF=30*60*1000,SPAN=4*HALF;
let gSel=0,gOff=0,gFrom=0;const listCache=new Map();
function gWindow(){const from=Math.floor(Date.now()/HALF)*HALF+gOff*HALF;return{from,to:from+SPAN};}
function getListing(ch,from,to){const k=ch.num+'|'+ch.name+'|'+from;if(!listCache.has(k)){const p=listing(ch,from,to);listCache.set(k,p);p.catch(()=>listCache.delete(k));}return listCache.get(k);}
function openGuide(){if(!guide.classList.contains('on'))try{history.pushState({guide:1},'');}catch(e){}gSel=chIdx;gOff=0;guide.classList.add('on');renderGuide();scrollSel();}
function closeGuide(){if(!guide.classList.contains('on'))return;guide.classList.remove('on');try{if(history.state&&history.state.guide)history.back();}catch(e){}}
window.addEventListener('popstate',()=>guide.classList.remove('on'));
function renderGuide(){
  const {from,to}=gWindow();gFrom=from;const t=Date.now();
  $('gclock').innerHTML=`<span id="gct">${fmtClock(t)}</span><small>${new Date(t).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}</small>`;
  let h=`<div class="grow head"><div class="gch">${gOff?'◀ ':''}${new Date(from).toLocaleDateString([],{weekday:'short'})}</div><div class="gtrack">`;
  for(let i=0;i<4;i++)h+=`<div class="gtick" style="left:${i*25}%">${fmtClock(from+i*HALF)}${i===3?' ▶':''}</div>`;
  h+=`</div></div>`;
  channels.forEach((c,i)=>{
    h+=`<div class="grow${i===gSel?' sel':''}" data-i="${i}"><div class="gch"><b>${c.num}</b>${esc(c.name)}${c.custom?`<button class="x" data-del="${c.num}">✕</button>`:''}</div><div class="gtrack" id="gt${i}"><div class="gload">…</div></div></div>`;
  });
  h+=`<form id="gadd"><input id="an" placeholder="New channel name" required><input id="at" placeholder="Shows, comma-separated (e.g. kenan & kel, rocket power)" required><button>+ ADD</button></form>
      <div class="hint">↑/↓ pick a channel · ←/→ move through time · Enter or tap to tune · Esc to close. Custom channels are saved in this browser; everything streams straight from archive.org.</div>`;
  $('gbody').innerHTML=h;
  $('gbody').querySelectorAll('.grow[data-i]').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;closeGuide();tune(+r.dataset.i);});
  $('gbody').querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=+b.dataset.del;
    lsSet('y2k:custom',(lsGet('y2k:custom')||[]).filter(x=>x.num!==n));const cur=channels[chIdx].num;loadChannels();chIdx=Math.max(0,channels.findIndex(c=>c.num===cur));gSel=Math.min(gSel,channels.length-1);renderGuide();});
  $('gadd').onsubmit=e=>{e.preventDefault();const name=$('an').value.trim().toUpperCase(),terms=$('at').value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!name||!terms.length)return;const list=lsGet('y2k:custom')||[];const num=Math.max(100,...channels.map(c=>c.num+1));
    list.push({num,name,terms,desc:terms.join(', ')});lsSet('y2k:custom',list);loadChannels();closeGuide();tune(channels.findIndex(c=>c.num===num));};
  channels.forEach((c,i)=>fillRow(c,i,from,to));
  renderInfo();
}
async function fillRow(c,i,from,to){
  let progs;
  try{progs=await getListing(c,from,to);}catch(e){const el=$('gt'+i);if(el&&gFrom===from)el.innerHTML=`<div class="gload">📡 ${esc(e.message)}</div>`;return;}
  const el=$('gt'+i);if(!el||gFrom!==from)return;const t=Date.now();
  let h=t>=from&&t<to?`<div class="gnow" style="left:${(t-from)/SPAN*100}%"></div>`:'';
  for(const p of progs){const l=Math.max(0,(p.start-from)/SPAN*100),r=Math.min(100,(p.end-from)/SPAN*100);
    const live=p.start<=t&&p.end>t;const ep=epTitle(p);
    h+=`<div class="gp${live?' live':''}${(p.start<=from+1&&p.end>from)?' focus':''}" style="left:${l}%;width:calc(${r-l}% - 2px)" title="${esc(p.show)}${ep?' — '+esc(ep):''}">${esc(p.show)}${ep?`<small>${esc(ep)}</small>`:''}</div>`;}
  el.innerHTML=h;
}
async function renderInfo(){
  const c=channels[gSel];const {from,to}=gWindow();const at=gOff?from:Date.now();
  $('ginfo').innerHTML=`<div class="s">${c.num} · ${esc(c.name)}</div><div class="t">${esc(c.desc||'')}</div>`;
  try{const progs=await getListing(c,from,to);if(channels[gSel]!==c||gFrom!==from)return;
    const p=progs.find(x=>x.start<=at&&x.end>at)||progs[0];if(!p)return;const ep=epTitle(p);
    $('ginfo').innerHTML=`<div class="s">${c.num} · ${esc(c.name)} · ${fmtClock(p.start)} – ${fmtClock(p.end)}</div><div class="t">${esc(p.show)}</div>${ep?`<div>${esc(ep)}</div>`:''}<div class="s">from the Internet Archive · <a href="https://archive.org/details/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${esc(p.id)}</a></div>`;
  }catch(e){}
}
function scrollSel(){const r=$('gbody').querySelector('.grow.sel');if(r)r.scrollIntoView({block:'nearest'});}
function moveSel(d){gSel=(gSel+d+channels.length)%channels.length;$('gbody').querySelectorAll('.grow[data-i]').forEach(r=>r.classList.toggle('sel',+r.dataset.i===gSel));scrollSel();renderInfo();}
setInterval(()=>{
  if(guide.classList.contains('on')){if(gWindow().from!==gFrom)renderGuide();else{const el=$('gct');if(el)el.textContent=fmtClock(Date.now());}}
  if(banner.classList.contains('on'))renderBanner();
},15000);

/* ---- Remote ---- */
$('bUp').onclick=()=>tune(chIdx+1);
$('bDown').onclick=()=>tune(chIdx-1);
$('bLast').onclick=()=>{if(lastIdx!=null)tune(lastIdx);};
$('bGuide').onclick=()=>guide.classList.contains('on')?closeGuide():openGuide();
$('bInfo').onclick=()=>showBanner(8000);
$('bMute').onclick=()=>{v.muted=!v.muted;$('bMute').textContent=v.muted?'UNMUTE':'MUTE';if(v.muted)showOSD('MUTE');};
$('bFull').onclick=()=>{const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);};
$('bPower').onclick=()=>{try{const el=document.documentElement;const fs=el.requestFullscreen||el.webkitRequestFullscreen;if(fs){const r=fs.call(el);if(r&&r.catch)r.catch(()=>{});}}catch(e){}$('power').remove();v.muted=false;tune(chIdx,{remember:false});};
let numBuf='',numTimer=null;
function tuneNumber(){const n=parseInt(numBuf,10);numBuf='';const i=channels.findIndex(c=>c.num===n);
  if(i>=0)tune(i);else{const nearest=channels.reduce((b,c,j)=>Math.abs(c.num-n)<Math.abs(channels[b].num-n)?j:b,0);showOSD(n+' ✕');setTimeout(()=>tune(nearest),700);}}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if($('power')){if(e.key==='Enter'||e.key===' ')$('bPower').click();return;}
  const k=e.key,g=guide.classList.contains('on');
  if(k==='ChannelUp'){e.preventDefault();tune(chIdx+1);return;}
  if(k==='ChannelDown'){e.preventDefault();tune(chIdx-1);return;}
  if(k==='Guide'||k==='ContextMenu'){e.preventDefault();g?closeGuide():openGuide();return;}
  if(k==='Info'){e.preventDefault();showBanner(8000);return;}
  if(g&&(k==='GoBack'||k==='BrowserBack'||k==='Backspace')){e.preventDefault();closeGuide();return;}
  if(g){
    if(k==='ArrowUp'){e.preventDefault();moveSel(-1);}
    else if(k==='ArrowDown'){e.preventDefault();moveSel(1);}
    else if(k==='ArrowRight'){e.preventDefault();if(gOff<24){gOff++;renderGuide();scrollSel();}}
    else if(k==='ArrowLeft'){e.preventDefault();if(gOff>0){gOff--;renderGuide();scrollSel();}}
    else if(k==='Enter'){e.preventDefault();closeGuide();tune(gSel);}
    else if(k==='Escape'||k==='g'||k==='G')closeGuide();
    return;
  }
  if(k==='ArrowUp'||k==='PageUp'){e.preventDefault();tune(chIdx+1);}
  else if(k==='ArrowDown'||k==='PageDown'){e.preventDefault();tune(chIdx-1);}
  else if(k==='g'||k==='G'||k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();openGuide();}
  else if(k==='i'||k==='I'||k==='Enter'){e.preventDefault();showBanner(8000);}
  else if(k==='l'||k==='L'||k==='Backspace'){e.preventDefault();$('bLast').click();}
  else if(k==='m'||k==='M')$('bMute').click();
  else if(k==='f'||k==='F')$('bFull').click();
  else if(/^[0-9]$/.test(k)){numBuf=(numBuf+k).slice(-3);showOSD(numBuf+'-');clearTimeout(numTimer);numTimer=setTimeout(tuneNumber,1200);}
});
let idle=null;function wake(){bar.classList.remove('hide');clearTimeout(idle);idle=setTimeout(()=>{if(!guide.classList.contains('on'))bar.classList.add('hide');},3500);}
['mousemove','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));wake();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('power'))tune(chIdx,{quiet:true,remember:false});});
</script>
</body>
